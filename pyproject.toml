[project]
name = "langgraph-beads-memory"
version = "0.1.0"
description = "Beads-style durable memory for LangGraph agents on Postgres"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[project.optional-dependencies]
demo = [
    "langchain-ollama>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    "langmem>=0.0.29",
]
playground = [
    "ddgs>=9.14.4",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beads_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["beads_memory"]
