<!doctype html>
<meta charset="utf-8">
<title>beads-memory playground</title>
<style>
  :root {
    --bg:#faf8f4; --fg:#2b2620; --muted:#8a8175; --line:#d9d2c6; --panel:#fff;
    --warm:#b45309; --cool:#0f766e; --warmbg:#f5e3cd; --coolbg:#d5ebe8; --bad:#b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#171512; --fg:#ece5da; --muted:#93897b; --line:#3b362e; --panel:#201d19;
      --warm:#f59e0b; --cool:#2dd4bf; --warmbg:#3a2c17; --coolbg:#12332f; --bad:#f87171;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",Helvetica,sans-serif;
         display:grid; grid-template-columns:230px 1fr; height:100vh; }
  aside { border-right:1px solid var(--line); padding:14px; overflow-y:auto; }
  aside h1 { font-size:14px; margin:0 0 4px; }
  aside p { font-size:11px; color:var(--muted); margin:0 0 12px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line);
           background:var(--panel); color:var(--fg); border-radius:6px; padding:6px 10px; }
  button:hover { border-color:var(--muted); }
  .chat { display:block; width:100%; text-align:left; margin-bottom:5px; font-size:12.5px;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat.on { border-color:var(--cool); }
  main { display:flex; flex-direction:column; min-width:0; }
  header { padding:10px 16px; border-bottom:1px solid var(--line);
           display:flex; gap:14px; align-items:baseline; }
  header b { font-size:13px; } header span { font-size:11px; color:var(--muted); }
  #streams { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:0; overflow:hidden; }
  .col { overflow-y:auto; padding:14px; min-width:0; }
  .col:first-child { border-right:1px solid var(--line); }
  .lbl { position:sticky; top:-14px; background:var(--bg); padding:4px 0 8px;
         font-size:11px; font-weight:650; letter-spacing:.04em; text-transform:uppercase; }
  .lbl.b { color:var(--warm); } .lbl.t { color:var(--cool); }
  .msg { margin-bottom:14px; }
  .you { background:var(--panel); border:1px solid var(--line); border-radius:8px;
         padding:8px 10px; font-size:13px; margin-bottom:6px; }
  .ans { border-radius:8px; padding:10px 12px; font-size:13px;
         border:1px solid var(--line); background:var(--panel); overflow-wrap:anywhere; }
  .ans > :first-child { margin-top:0; } .ans > :last-child { margin-bottom:0; }
  .ans h1,.ans h2,.ans h3 { font-size:13px; margin:12px 0 5px; line-height:1.35; }
  .ans h1 { font-size:14.5px; } .ans h2 { font-size:13.5px; }
  .ans p { margin:0 0 8px; }
  .ans ul,.ans ol { margin:0 0 8px; padding-left:20px; }
  .ans li { margin:2px 0; }
  .ans li > ul, .ans li > ol { margin:2px 0; }
  .ans code { font-family:ui-monospace,Menlo,monospace; font-size:11.5px;
              background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:1px 4px; }
  .ans pre { background:var(--bg); border:1px solid var(--line); border-radius:6px;
             padding:8px 10px; overflow-x:auto; margin:0 0 8px; }
  .ans pre code { border:0; background:none; padding:0; font-size:11.5px; }
  .ans a { color:var(--cool); } .ans hr { border:0; border-top:1px solid var(--line); margin:10px 0; }
  .ans table { border-collapse:collapse; margin:0 0 8px; font-size:12px; }
  .ans th,.ans td { border:1px solid var(--line); padding:3px 7px; text-align:left; }
  .b .ans { border-left:3px solid var(--warm); }
  .t .ans { border-left:3px solid var(--cool); }
  .meta { font-size:10.5px; color:var(--muted); margin-top:5px;
          font-family:ui-monospace,Menlo,monospace; }
  .err { color:var(--bad); }
  details { margin-top:6px; }
  summary { font-size:10.5px; color:var(--muted); cursor:pointer; }
  .facts { margin-top:5px; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .fact { padding:5px 8px; font-size:11px; border-bottom:1px solid var(--line);
          display:grid; grid-template-columns:52px 1fr; gap:8px; }
  .fact:last-child { border-bottom:0; }
  .fact code { font-size:10px; color:var(--muted); }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  input[type=text] { flex:1; font:inherit; padding:9px 11px; border-radius:7px;
                     border:1px solid var(--line); background:var(--panel); color:var(--fg); }
  .empty { color:var(--muted); font-size:12.5px; padding:20px 0; }
  .working { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted);
             border:1px dashed var(--line); border-radius:8px; padding:9px 11px; }
  .dot { width:7px; height:7px; border-radius:50%; background:currentColor;
         animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.25} 50%{opacity:1} }
  .b .working { color:var(--warm); } .t .working { color:var(--cool); }
  .waiting { opacity:.55; font-style:italic; }
  #title { cursor:text; border-bottom:1px dashed transparent; }
  #title:hover { border-bottom-color:var(--muted); }
  .hint { font-size:11px; color:var(--muted); padding:2px 16px 0; }
</style>

<aside>
  <h1>beads-memory</h1>
  <p>One message, two memory layers. Each chat is one session; every message is a
     new thread, so anything recalled came from memory.</p>
  <button id="new" style="width:100%; margin-bottom:12px;">+ New chat</button>
  <div id="chats"></div>
</aside>

<main>
  <header>
    <b id="title" title="click to rename">No chat</b>
    <span id="sub"></span>
  </header>
  <div id="streams">
    <div class="col b" id="colb"><div class="lbl b">Baseline · LangMem + PostgresStore</div><div id="b"></div></div>
    <div class="col t" id="colt"><div class="lbl t">Treatment · typed fact graph</div><div id="t"></div></div>
  </div>
  <form id="f">
    <input type="text" id="q" placeholder="Type to start — a chat is created automatically…" autocomplete="off">
    <button type="submit" id="send">Send</button>
  </form>
</main>

<script>
let chatId = null;
// Busy is per CHAT, not global. A single flag disabled Send everywhere, so a
// run in one chat blocked every other chat — and switching away left the
// button dead with no explanation.
const busy = new Set();

function syncSend() {
  const send = document.getElementById('send');
  const running = chatId && busy.has(chatId);
  send.disabled = !!running;
  send.textContent = running ? 'Running…' : 'Send';
  document.getElementById('q').placeholder = running
    ? 'This chat is answering — switch chats or wait…'
    : 'Type to start — a chat is created automatically…';
}

const api = async (url, opts) => {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!r.ok) throw new Error((await r.text()).slice(0, 300));
  return r.json();
};
const esc = s => (s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function factsHtml(facts) {
  if (!facts || !facts.length) return '';
  const rows = facts.map(f =>
    `<div class="fact"><code>${f.distance.toFixed(3)}${f.demoted ? ' \u2193' : ''}</code>
     <div>${esc(f.body)}<br><code>${esc(f.kind)}/${esc(f.source)}</code></div></div>`).join('');
  return `<details><summary>${facts.length} facts injected \u2014 distances, \u2193 = demoted sub-agent fact</summary>
          <div class="facts">${rows}</div></details>`;
}


// Minimal markdown -> HTML. The models answer in markdown; rendering it as
// plain text made every reply look like a wall of asterisks and hashes.
// Escaping happens FIRST and the transforms only ever introduce tags of our
// own, so model output can never inject markup.
function md(src) {
  let t = esc(src ?? '');

  // Fenced code first, parked behind placeholders so nothing else rewrites it.
  const blocks = [];
  t = t.replace(/```[a-z]*\n?([\s\S]*?)```/gi, (_m, code) => {
    blocks.push(code.replace(/\n$/, ''));
    return `\u0000BLOCK${blocks.length - 1}\u0000`;
  });

  const inline = x => x
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  const out = [];
  let list = null;                       // 'ul' | 'ol' | null
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };

  for (const raw of t.split('\n')) {
    const line = raw.replace(/\s+$/, '');
    if (/^\u0000BLOCK\d+\u0000$/.test(line.trim())) {
      closeList(); out.push(line.trim()); continue;
    }
    if (!line.trim()) { closeList(); continue; }
    if (/^\s*(---|\*\*\*|___)\s*$/.test(line)) { closeList(); out.push('<hr>'); continue; }

    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { closeList(); const n = Math.min(h[1].length, 3); out.push(`<h${n}>${inline(h[2])}</h${n}>`); continue; }

    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      const want = ul ? 'ul' : 'ol';
      if (list !== want) { closeList(); out.push(`<${want}>`); list = want; }
      out.push(`<li>${inline((ul || ol)[1])}</li>`);
      continue;
    }
    closeList();
    out.push(`<p>${inline(line)}</p>`);
  }
  closeList();

  return out.join('\n').replace(/\u0000BLOCK(\d+)\u0000/g,
    (_m, i) => `<pre><code>${blocks[+i]}</code></pre>`);
}

function armHtml(a) {
  if (!a) return '';
  if (a.error) return `<div class="ans err">${esc(a.error)}</div>`;
  const tools = a.tools.length ? ` \u00b7 tools: ${a.tools.join(', ')}` : ' \u00b7 no tool calls';
  return `<div class="ans">${a.answer ? md(a.answer) : '<i>(empty answer)</i>'}</div>
          <div class="meta">${a.seconds}s \u00b7 ${a.input_tokens} input tokens${esc(tools)}</div>
          ${factsHtml(a.injected)}`;
}

// Each turn owns one node per column, so an arm can be filled in when it lands
// without disturbing the other. Waiting for both before showing anything reads
// as a hang when each takes minutes.
function turnNode(col, n, user) {
  const id = `turn-${col}-${n}`;
  let el = document.getElementById(id);
  if (!el) {
    const host = document.getElementById(col);
    host.querySelector('.empty')?.remove();
    host.insertAdjacentHTML('beforeend',
      `<div class="msg" id="${id}"><div class="you">${esc(user)}</div><div class="slot"></div></div>`);
    el = document.getElementById(id);
  }
  return el.querySelector('.slot');
}

function showWorking(slot, label) {
  const t0 = Date.now();
  slot.innerHTML = `<div class="working"><span class="dot"></span><span>${label}</span>
                    <span class="elapsed">0s</span></div>`;
  const span = slot.querySelector('.elapsed');
  return setInterval(() => { span.textContent = Math.round((Date.now() - t0) / 1000) + 's'; }, 1000);
}

function slotHtml(turn, arm, label) {
  if (turn[arm]) return armHtml(turn[arm]);
  const st = turn[arm + '_status'] || 'queued';
  if (st === 'running') {
    const since = turn[arm + '_started'] ? Math.round(Date.now() / 1000 - turn[arm + '_started']) : 0;
    return `<div class="working"><span class="dot"></span><span>${label} running</span>
            <span class="elapsed">${since}s</span></div>`;
  }
  return '<div class="working waiting"><span>queued \u2014 waiting for the model</span></div>';
}

function renderTurn(turn) {
  for (const [arm, col, label] of [['baseline', 'b', 'baseline'], ['treatment', 't', 'treatment']]) {
    const slot = turnNode(col, turn.n, turn.user);
    slot.innerHTML = slotHtml(turn, arm, label);
  }
}

function incomplete(turns) {
  return turns.some(t => !t.baseline || !t.treatment);
}

let poll = null;
async function refresh(scroll) {
  if (!chatId) return;
  const c = await api('/api/chats/' + chatId);
  document.getElementById('title').textContent = c.title;
  document.getElementById('sub').textContent = `${c.turns.length} messages \u00b7 session ${chatId}`;
  c.turns.forEach(renderTurn);
  if (scroll) document.querySelectorAll('.col').forEach(el => el.scrollTop = 1e9);

  // Busy is derived from the server, not tracked client-side, so a reload or a
  // second tab shows the same truth.
  const running = incomplete(c.turns);
  if (running !== busy.has(chatId)) {
    running ? busy.add(chatId) : busy.delete(chatId);
    loadChats();
  }
  syncSend();
  clearInterval(poll);
  // Poll while anything is unfinished; the elapsed counters also need ticking.
  if (running) poll = setInterval(() => refresh(false), 1000);
}

async function loadChats() {
  const chats = await api('/api/chats');
  document.getElementById('chats').innerHTML = chats.map(c =>
    `<button class="chat ${c.id === chatId ? 'on' : ''}" data-id="${c.id}">${busy.has(c.id) ? '\u25cf ' : ''}${esc(c.title)}</button>`).join('')
    || '<p style="font-size:11px;color:var(--muted)">no chats yet</p>';
  document.querySelectorAll('.chat').forEach(b => b.onclick = () => openChat(b.dataset.id));
}

async function openChat(id) {
  chatId = id;
  clearInterval(poll);
  document.getElementById('b').innerHTML = '';
  document.getElementById('t').innerHTML = '';
  const c = await api('/api/chats/' + id);
  if (!c.turns.length) {
    document.getElementById('b').innerHTML = '<div class="empty">Send a message \u2014 both arms answer it.</div>';
    document.getElementById('t').innerHTML = '<div class="empty">The treatment also shows what it injected.</div>';
  }
  await refresh(true);
  loadChats();
}

async function newChat() {
  const c = await api('/api/chats', { method: 'POST', body: JSON.stringify({}) });
  await openChat(c.id);
  return c.id;
}
document.getElementById('new').onclick = newChat;

document.getElementById('title').onclick = async () => {
  if (!chatId) return;
  const next = prompt('Rename chat', document.getElementById('title').textContent);
  if (next === null || !next.trim()) return;
  const r = await api('/api/chats/' + chatId, { method: 'PATCH', body: JSON.stringify({ title: next }) });
  document.getElementById('title').textContent = r.title;
  loadChats();
};

document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const q = document.getElementById('q');
  const text = q.value.trim();
  if (!text) return;
  if (!chatId) await newChat();      // implicit chat: requiring "+ New chat" first was a trap
  q.value = '';
  try {
    await api(`/api/chats/${chatId}/turns`, { method: 'POST', body: JSON.stringify({ text }) });
  } catch (err) {
    q.value = text;                  // give the message back
    alert(err); return;
  }
  // The server runs the turn; this just watches. Closing the tab no longer
  // strands it.
  await refresh(true);
  loadChats();
};

loadChats();
</script>
